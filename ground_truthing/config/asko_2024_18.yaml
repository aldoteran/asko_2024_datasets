# Path to save the created csv results.
path_to_data: "/home/aldoteran/docking_ws/src/asko_2024_datasets/ground_truthing/results/18/"
# If you want the output to be verbose AF.
debug: false
# If you want to append the results to the rosbag.
append_results: false

# ------------- PRIORS -------------
# Standard deviation of the prior information's translation components [m].
prior_x_stddev: 5.0
prior_y_stddev: 5.0
prior_z_stddev: 0.1
# Standard deviation of the prior information's rotation components [rad].
prior_roll_stddev: 0.00001
prior_pitch_stddev: 0.00001
prior_yaw_stddev: 0.00001
# Prior standard deviation on the target's velocity [m/s].
prior_vel_x_stddev: 0.001
prior_vel_y_stddev: 0.001
prior_vel_z_stddev: 0.1
# ------------- PRIORS -------------

# ------------- NOISE --------------
# USBL position noise.
usbl_x_stddev: 7.5
usbl_y_stddev: 7.5
usbl_z_stddev: 2.0
# Optical measurement noise.
optical_trans_stddev: 0.1 # [m]
optical_rot_stddev: 0.005 # 5 deg in [rad]
# Altitude of SBG above the waterline is 1.55m, but since our reference
# is LoLo's INS, which measures 0 at the surface but the INS ref point
# lies ca. 0.5m below it, we add this as an offset to the altitude meas.
manual_altitude: 1.85  # [m]
manual_altitude_stddev: 0.85 # [m]
# Initial Bias (if previously estimated)
init_accel_bias_x: 0.0628933
init_accel_bias_y: -0.0250815118
init_accel_bias_z: -0.0265742397
init_omega_bias_x: 0.00380564106
init_omega_bias_y: -0.000306797758
init_omega_bias_z: 0.0018205596
# Initial Bias noise.
init_accel_bias_stddev: 0.00450327
init_omega_bias_stddev: 0.000080977
# VALUES FOR SBG ELLIPSE A
# Standard deviation for the linear acceleration measurements [m/s2].
accel_noise_x: 0.00052925
accel_noise_y: 0.00052925
accel_noise_z: 0.00052925
# Bias standard deviation for the linear acceleration measurements [m/s2]
accel_bias_x: 0.00000872151
accel_bias_y: 0.00000872151
accel_bias_z: 0.00000872151
# Standard deviation for the angular velocity measurements [???].
omega_noise_x: 0.0000843214
omega_noise_y: 0.0000843214
omega_noise_z: 0.0000843214
# Bias standard deviation for the angular velocity measurements [rad/s]
omega_bias_x: 0.00000305698
omega_bias_y: 0.00000305698
omega_bias_z: 0.00000305698
# Measurement frequency [Hz].
imu_frequency: 25.0
