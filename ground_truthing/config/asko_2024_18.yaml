# Setup the sensor extrinsic calibrations. The extrinsic rotations are
# built using gtsam::Rot3::RzRyRx, see their documentation for angle convention.
# Angles increase counterclockwise when looking from the unchanged axis.
# Rotation multiplication is done in yaw-pitch-roll convention.
# Chaser's camera's extrinsic calibration params. base->camera.
#camera_extrinsics_yaw: 1.5707 # [rad]
#camera_extrinsics_pitch: -1.5707 # [rad]
#camera_extrinsics_roll: 0.0 # [rad]
